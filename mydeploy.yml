apiVersion: apps/v1
kind: Deployment
metadata:
  name: myjavaapp-deploy
  labels:
    app: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
        - name: myjavaapp
          image: 938565868582.dkr.ecr.us-east-2.amazonaws.com/myjavaapp:1
          ports:
            - containerPort: 8080